# Active public openAMRobot repositories, the single list the Watchdog organization scan
# (.github/workflows/watchdog-org-scan.yml) clones and checks on their default branch.
# Add or remove a repository here only; tests/test_org_scan.py validates this file.
organization: openAMRobot
repositories:
  - {name: .github, default_branch: main}
  - {name: openamr-platform-sw, default_branch: main}
  - {name: openamr-platform-fw, default_branch: main}
  - {name: openamr-platform-hw, default_branch: main}
  - {name: openamr-upperbody-sw, default_branch: main}
  - {name: openamr-upperbody-fw, default_branch: main}
  - {name: openamr-upperbody-hw, default_branch: main}
  - {name: openamrobot-interfaces, default_branch: main}
  - {name: openamrobot-manipulation, default_branch: main}
  - {name: openamrobot-ui, default_branch: main}
  - {name: openamrobot-comm, default_branch: main}
  - {name: openamrobot-docs, default_branch: main}
  - {name: openamrobot-manifest, default_branch: main}
  - {name: openamrobot-release, default_branch: main}
