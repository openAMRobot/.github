      - main battery bus 25.6 V nominal (not a regulated 24 V rail)
      - regulated 24 V branch (safety relay, brake coils, peripherals, separately fused Hokuyo branch)
      - regulated 5 V
      - no 12 V rail
    unit: V
    date: null
    source: {document: P-03-rev18.1, item: item 2 line 10}
    applies_to:
      repositories: ["openamr-platform-*", "openamr-upperbody-*", "openamrobot-docs"]
    check:
      - pattern: '(?P<found>\b12\s*V\s+rail)'
        unless: '\bno 12|not|never|legacy'
        message: there is no 12 V rail in 2.0
      - pattern: '(?P<found>24\s*V?\s*(?:->|→|to)\s*5\s*V?\s*/\s*12\s*V)'
        unless: 'legacy'
        message: there is no 12 V rail in 2.0
    owner: platform-lead

  - id: DOCKING-SCOPE
    title: Docking scope in 2.0
    status: recorded
    value: Positioning only; docked means accepted pose within tolerance; manual wired charging via PWR-019 with independent charge-plug-presence inhibition; no dock contacts or dock pilot; pose success never establishes charging; wireless charging is 3.0
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: item 3 line 11}
    applies_to:
      repositories: ["openamr-platform-*", "openamrobot-docs", "openamrobot-ui", "openamrobot-interfaces"]
    check:
      - pattern: '(?P<found>charg(?:e|ing)[ -]contacts?)'
        unless: '\bno\b|\bnot\b|without|3\.0|never'
        message: 2.0 docking has no dock contacts
      - pattern: '(?P<found>SimpleChargingDock|ready to charge|charging target)'
        unless: 'not |never|instead|non-charging'
        message: 2.0 docking is positioning only
      - pattern: '(?P<found>(?:charge|charger|DC)\s*\+?\s*pilot)'
        unless: '\bno\b'
        message: no dock or charge pilot in 2.0
      - pattern: '(?P<found>wireless charging)'
        unless: '3\.0|later|deferred|not '
        message: wireless charging belongs to 3.0
    owner: platform-lead

  - id: SAFETY-PROCUREMENT
    title: Safety-chain procurement boundary (record only; this file implements no safety function)
    status: recorded
    values:
      - two installed E-stops (base front panel and chest), red latching mushroom, dual normally-closed channels into a monitored safety relay
      - K1 and K2 contactors from the LEV100 family; the linked-feedback (EDM) variant is unselected under one CONTACTOR gate
      - CTL-004 ISO1212EVM is bench-only until an installed solution is qualified
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: items 4 and 5 lines 12-13}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
