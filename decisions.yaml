        unless: 'do not order|not evidence|unselected|reference only'
        message: the EDM variant is not selected; do not present LEV100A5ANG as the order
      - pattern: '(?P<found>fine for prototypes)'
        message: no single-contact or clone E-stop recommendation
      - pattern: '(?P<found>CTL-004[^\n]{0,60}\b(?:installed|robot interface))'
        unless: 'bench-only|until'
        message: CTL-004 is bench-only
    owner: platform-lead

