  - id: DOCK-NO-CONTACTS
    title: Release 2.0 docking has no dock contacts or dock pilot; wireless charging is 3.0
    kind: exclusion
    status: recorded
    value: Positioning only; manual wired charging via PWR-019 with independent charge-plug-presence inhibition; no dock contacts or dock pilot; wireless charging belongs to 3.0
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: item 3 line 11}
    applies_to:
      repositories: ["openamr-platform-*", "openamrobot-docs", "openamrobot-ui", "openamrobot-interfaces"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.launch.py", "**/*.xacro", "**/*.urdf"]
    check:
      - pattern: '(?P<found>charg(?:e|ing)[ -]contacts?)'
        unless: '\bno\b|\bnot\b|without|3\.0|never'
        message: 2.0 docking has no dock contacts
      - pattern: '(?P<found>(?:charge|charger|dock|DC)\s*\+?\s*pilot)'
        unless: '\bno\b'
        message: no dock or charge pilot in 2.0
      - pattern: '(?P<found>wireless charging)'
        unless: '3\.0|later|deferred|not '
        message: wireless charging belongs to 3.0
    verification:
      machine: charge contacts or pilots without a negation; wireless charging without a 3.0 label
      human: {reviewer: platform-lead, evidence: dock drawing and harness list without contacts}
    owner: platform-lead

  - id: DOCKING-NOT-CHARGING
    title: Docking success never establishes charging
    kind: distinction
    status: recorded
    value: Docked means an accepted pose within tolerance; pose success never establishes charging or external power
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: item 3 line 11; DOCK-WP lines 27 and 70}
    applies_to:
      repositories: ["openamr-platform-*", "openamrobot-docs", "openamrobot-ui", "openamrobot-interfaces"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.launch.py", "**/*.py", "**/*.ts", "**/*.tsx", "**/*.js"]
    check:
      - pattern: '(?P<found>SimpleChargingDock|ready to charge|charging target)'
        unless: 'not |never|instead|non-charging'
        message: 2.0 docking is positioning only
      - pattern: '(?P<found>isCharging[^\n]{0,20}\breturn\s+true|return\s+true[^\n]{0,20}isCharging)'
        message: never report charging from a docking pose
      - pattern: '(?P<found>dock(?:ed|ing)?[^\n]{0,60}\b(?:connected to (?:external )?power|is charging|charging (?:started|confirmed)))'
        unless: '\bnot\b|never|does not'
        message: docking success never establishes charging
    verification:
      machine: charging dock plugins, forced isCharging, text deriving charging or external power from docking
      human: {reviewer: software-lead, evidence: docking state machine and UI source showing charge state comes only from the charge-plug-presence input}
    owner: platform-lead

  - id: TELEMETRY-NOT-SAFETY-EVIDENCE
    title: Functional telemetry is never safety evidence
    kind: distinction
    status: recorded
    value: Firmware status, watchdogs, collision monitoring and BMS telemetry are functional; E-stop, brake and actuator power removal are hardwired and independent of software
    unit: none
    date: null
    source: {document: P-00-rev18.1, item: txt 70 and 78; I8-WP line 669; DOCK-WP line 110}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.html", "**/*.yaml", "**/*.yml"]}
    check:
      - pattern: '(?P<found>(?:watchdog|collision monitor|telemetry|status message|diagnostic)s?[^\n]{0,40}\bsafety (?:layer|function|evidence|guarantee))'
        unless: '\bnot\b|never|functional|no substitute'
        message: functional telemetry is not a safety layer or safety evidence
    verification:
      machine: text calling watchdogs, collision monitoring, telemetry or diagnostics a safety layer, function or evidence
      human: {reviewer: platform-lead, evidence: hardwired safety-chain test record; a software PASS is never accepted in its place}
    owner: platform-lead

  - id: SAFETY-PROCUREMENT
    title: Safety-chain procurement boundary (record only; this register implements no safety function)
    kind: limit
    status: recorded
    values:
      - two installed E-stops (base front panel and chest), red latching mushroom, dual normally-closed channels into a monitored safety relay
      - K1 and K2 contactors from the LEV100 family; the linked-feedback (EDM) variant is unselected under one CONTACTOR gate
      - CTL-004 is bench-only until an installed solution is qualified
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: items 4 and 5 lines 12-13}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
      - pattern: '(?P<found>(?:EDM|linked[- ]feedback) variant[^\n]{0,30}\b(?:selected|chosen|decided))'
        unless: '\bnot\b|unselected|open'
        message: the EDM variant is not selected
      - pattern: '(?P<found>fine for prototyp\w*|single[- ]contact[^\n]{0,30}e-?stop)'
        message: no single-channel or uncertified E-stop recommendation
      - pattern: '(?P<found>CTL-004[^\n]{0,60}\b(?:installed|robot interface))'
        unless: 'bench-only|until'
        message: CTL-004 is bench-only
    verification:
      machine: text claiming the EDM variant is chosen, recommending a single-channel or uncertified E-stop, or presenting CTL-004 as installed
      human: {reviewer: platform-lead, evidence: safety-chain design and component certificates; two human approvals per the repository ruleset}
    owner: platform-lead

