    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/package.xml", "**/*.xacro", "**/*.urdf"]}
    check:
      - pattern: '(?P<found>\bno (?:linear |actuated )?lift\b(?=\s*(?:[.,;:)]|$|(?:in|for|on)\b)))'
        unless: 'supersed|historical|earlier|previous|no longer|rev ?18\.[1-6]\b'
        message: the lift is approved in principle for 2.0 (P-03 rev18.9)
      - pattern: '(?P<found>\bfixed[- ]mast\b)'
        unless: 'supersed|historical|earlier|previous|legacy|replace|instead of|no longer|rev ?18\.[1-6]\b'
        message: the fixed mast is no longer the baseline; the lift is approved in principle (P-03 rev18.9)
      - pattern: '(?P<found>\blift\b[^\n]{0,40}\b(?:deferred|moved|postponed)\b[^\n]{0,25}\b3\.0\b|\blift\b[^\n]{0,15}\bin (?:OpenAMRobot )?3\.0\b|\blift (?:is |was )?removed\b|\blift\b[^\n]{0,40}\b(?:OpenAMRobot )?3\.0 scope\b|\b3\.0 lift\b)'
        unless: 'supersed|historical|earlier|previous|no longer|rev ?18\.[1-6]\b'
        message: the lift is not deferred to 3.0; it is approved in principle for 2.0 (P-03 rev18.9)
      - pattern: '(?P<found>\bHexalift V1\b|\bBS-HD240D350530\b|\bdold_v1_350\b)'
        unless: 'supersed|historical|earlier|previous|replac|legacy|rev ?18\.[1-7]\b'
        message: the lift is the DOLD Hexalift V4 350 mm, BS-HM240G350530-MFF24 (P-03 rev18.9 item 16)
      - pattern: '(?P<found>\bbp(?:100|150|200)\b|\bfive[- ](?:position|fore-aft|base[- ]plate)\b|\+100, \+150 and \+200)'
        unless: 'supersed|historical|earlier|previous|replac|no longer|rev ?18\.[1-8]\b'
        message: the lift base plate has two fore-aft positions, centre and +50 mm (P-03 rev18.9 item 18)
    verification:
      machine: text saying 2.0 has no lift, presenting a fixed mast as current, deferring the lift to 3.0, naming Hexalift V1 as current, or base-plate positions beyond +50 mm
      human: {reviewer: platform-lead, evidence: "P-03 rev18.9 items 16 and 18, the option B drawing set and the release-gate records: DOLD holding on E-stop and power loss, supplier CAD, weighed mass, CAN3 lift interface, F2S rerun"}
    owner: platform-lead

  - id: ARM-MOUNT
    title: Shoulder datum and arm mount on the lift (option B)
    summary: "Shoulder = height of openarm_{side}_base_link; arm mount 180 mm ahead of the column axis, y +/-31 mm."
    fix_hint: "Attach the arm base links to the lift carriage as listed; the upstream openarm_body_link0 is not used."
    kind: configuration
    status: recorded
    values:
      - shoulder height is the height above the floor of the OpenArm arm mount point, frame openarm_{side}_base_link (J1_A interface); joint1 and joint2 have no vertical offset from it
      - the upstream OpenArm body (openarm_body_link0, arm mounts at z 0.698 m) is not part of OpenAMRobot; the arm base links attach to the lift carriage
      - arm mount points at y +/-0.031 m, roll, pitch and yaw 0, one 1 mm spacer under each J1_A plate; shoulder spacing 307 mm
      - arm mount point 0.180 m ahead of the lift column axis and 0.166 m above the column top plate
      - arm profile MISUMI HFS6-60120 (60 mm lateral, 120 mm fore-aft), 340 mm, end-tapped, standing on a 10 mm adapter plate on the column top
      - column axis at bp000 on the drive axle (x 0 from base_link), 330 mm behind the chassis front edge; bp050 is +0.050 m
      - calibrated lift stops L1000, L1175 and L1350 (shoulder height in mm); the lift height is joint state
    unit: m
    date: 2026-10-09
    review_by: 2026-11-20
    source: {document: P-03-rev18.9, item: "items 17 and 18"}
    supersedes:
      - {value: "fore-aft offset of the arm mount from the column axis 0 until CAD", source: P-03-rev18.8 item 17}
    applies_to: {repositories: ["openamr-*", "openamrobot-*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]}
    check:
      - pattern: '(?P<found>(?:parent|attach\w*|mount\w*)[^\n]{0,40}\bopenarm_body_link0\b)'
        unless: 'not used|removed|upstream|no OpenArm body|supersed|historical'
        message: the upstream OpenArm body is not used; attach openarm_{side}_base_link to the lift carriage (P-03 rev18.9 item 17)
    verification:
      machine: text or a model that attaches the arms to the upstream openarm_body_link0
      human: {reviewer: software-lead, evidence: "URDF frame tree: openarm_{side}_base_link under the lift carriage at x +0.180, y +/-0.031; shoulder z = 1.000 + lift q"}
    owner: platform-lead

  - id: CONFIG-IDS
