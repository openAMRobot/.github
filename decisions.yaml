    check:
      # The schema requires at least one check: a 2.0 final release given another date.
      - pattern: '(?P<found>2\.0 final release[^\n]{0,20}?\b(?!18 December 2026)\d{1,2} (?:January|February|March|April|May|June|July|August|September|October|November|December) \d{4})'
        unless: 'supersed|previous|earlier|historical'
        message: the OpenAMRobot 2.0 final release is 18 December 2026
