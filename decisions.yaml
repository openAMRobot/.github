# OpenAMRobot register of approved technical decisions.
#
# Two layers, kept separate:
#   - AGENTS.md and CONTRIBUTING.md hold process: how a decision is proposed,
#     reviewed, recorded, changed, tested and propagated.
#   - This file holds the approved technical decisions repositories follow:
#     values with units, allowed configurations, limits, exclusions and
#     semantic distinctions.
#
# CI evaluates only this pinned, version-controlled file. No check fetches a
# plan document, a drive or the documentation site. Source documents are
# provenance: when a source and this register disagree, a human resolves it
# (the entry's owner) and no tool rewrites either side. tools/check_decisions.py
# only reads files and reports.
#
# What the scan proves: that a scanned file does not contain a listed
# contradicting phrase. It proves textual consistency only, never mechanical,
# electrical or safety correctness. Each entry's `verification.human` names
# the reviewer and the evidence that the scan cannot provide.
#
# Schema (schema_version 1), one entry per decision:
#   id            unique, upper case, stable
#   title         one line
#   kind          value | configuration | limit | exclusion | distinction
#   status        recorded (scanned and reported) | open (not decided; not scanned)
#   value/values  exactly as the source states it; nothing invented
#   unit          SI unit or none
#   date          date the decision was taken (null when the source gives none)
#   source        document (a key under sources) and item
#   supersedes    earlier values with their source; optional `citation`, a
#                 pattern that finds text still citing the superseded source
#   applies_to    repositories (globs) and files (globs); exclude optional
#   check         patterns; each has a (?P<found>...) group, optional files
#                 (globs narrowing this pattern), optional line-level `unless`
#                 exemption and a message
#   verification  machine: what the scan detects; human: reviewer role and
#                 the evidence they need
#   owner         role in maintainers.yaml who approves changes to this entry
#
# Changing an entry follows "Changing a decision" in AGENTS.md: change request
# issue, source document first, then one reviewed PR that updates this file and
# every affected consumer together.
schema_version: 1

sources:
  P-03-rev18.2:
    title: P-03 Decision Addendum, revision 18.2, 28 September 2026 (earlier revision; superseded by revision 18.6 as the addendum in force)
    evidence: >-
      Not held in any repository. Confirmed by the platform lead on 29 September 2026
      as the addendum in force at that date. Values that cite it were seeded from its citation on the
      documentation site (openamrobot-docs main e0f2aac,
      docs/reference/openamrobot-2/index.md lines 30-39) and from that confirmation.
  P-03-rev18.4:
    title: P-03 Decision Addendum, revision 18.4 (earlier revision)
    evidence: plan-set document, not held in any repository; cited by item
  P-03-rev18.6:
    title: P-03 Decision Addendum, revision 18.6 (the addendum in force)
    evidence: plan-set document, not held in any repository; cited by item
  P-03-rev18.5:
    title: P-03 Decision Addendum, revision 18.5, 6 October 2026 (earlier revision)
    evidence: plan-set document, not held in any repository; cited by item
  P-03-rev18.3:
    title: P-03 Decision Addendum, revision 18.3 (earlier revision)
    evidence: plan-set document, not held in any repository; cited by item
  P-03-rev18.1:
    title: P-03 Decision Addendum, revision 18.1
    evidence: plan-set document, not held in any repository; cited by item and line
  P-00-rev18.1:
    title: P-00 Master Coordination Plan, revision 18.1
    evidence: plan-set document, not held in any repository; cited by text line
  BOM-Issue-7:
    title: OpenAMRobot 2.0 Detailed Hardware BOM, Issue 7, 27 September 2026 (canonical per P-03 rev18.2 item 7)
    evidence: not held in any repository; provenance only, CI never reads it
  I8-WP:
    title: I8 base-controller status work package
    evidence: plan-set work package, not held in any repository
  DOCK-WP:
    title: 2.0 docking work package
    evidence: plan-set work package, not held in any repository

# Never scanned: this register, checker fixtures and change logs.
exclude:
  - decisions.yaml
  - tests/fixtures/**
  - "**/CHANGELOG.md"
  - agent-runs.md

decisions:
  - id: BOM-ISSUE-IN-FORCE
    title: Canonical hardware BOM issue for OpenAMRobot 2.0
    kind: value
    status: recorded
    value: OpenAMRobot 2.0 Detailed Hardware BOM, Issue 7
    unit: none
    date: 2026-09-28
    source: {document: P-03-rev18.2, item: item 7}
    supersedes:
      - value: Issue 6, or an explicitly approved successor
        source: P-03-rev18.1 line 7
        citation: '(?P<found>P-03[^\n]{0,30}(?:rev(?:ision)?\.?\s*)?18\.1[^\n]{0,30}line\s*7)'
      - {value: B-01 development BOM and evidence register rev18, source: P-03-rev18.1 line 7}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.html", "**/*.yaml", "**/*.yml"]}
    check:
      - pattern: '(?P<found>(?:canonical|in force|of record)[^\n]{0,40}\bIssue\s*6\b|\bIssue\s*6\b[^\n]{0,40}\b(?:canonical|in force|of record))'
        unless: 'supersed|replaced|previous|earlier'
        message: BOM Issue 7 is the canonical hardware BOM (P-03 rev18.2 item 7)
      - pattern: '(?P<found>B-01[^\n]{0,60}\b(?:canonical|current))'
        unless: 'supersed'
        message: B-01 is superseded
    verification:
      machine: Issue 6 or B-01 presented as the canonical BOM; citations of P-03 rev18.1 line 7
      human: {reviewer: platform-lead, evidence: the BOM file header and issue number in the released BOM}
    owner: platform-lead

  - id: MAST-INSTALL-HEIGHT
    title: Shoulder-axis installation height of the fixed mast
    kind: configuration
    status: recorded
    value: 1350
    unit: mm
    configuration_id: mast_1350
    date: 2026-09-28
    source: {document: P-03-rev18.2, item: shoulder height}
    supersedes:
      - value: 1400
        configuration_id: mast_1400
        source: P-03-rev18.1 item 6 line 15
        citation: '(?P<found>P-03[^\n]{0,30}(?:rev(?:ision)?\.?\s*)?18\.1[^\n]{0,30}item\s*6)'
      - {value: 1300, configuration_id: mast_1300, source: working baseline before P-03-rev18.1 item 6}
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.xacro", "**/*.urdf", "**/*.launch.py", "**/package.xml", "**/*.html"]
    check:
      - pattern: '(?P<found>mast_1[34]00)\b[^\n]{0,60}\bbaseline'
        unless: 'supersed|rev ?18\.1|release-candidate position'
        message: installation baseline is mast_1350
      - pattern: '\bbaseline\b[^\n]{0,40}(?P<found>mast_1[34]00|\b1[34]00\s*mm)'
        unless: 'supersed|rev ?18\.1'
        message: installation baseline is mast_1350
      - pattern: '(?P<found>(?:shoulder[- ]axis|shoulder height|installation height)\s*(?:at|of|is|:)?\s*1[34]00\s*mm)'
        unless: 'supersed|rev ?18\.1|position'
        message: installation height is 1350 mm
    verification:
      machine: text naming mast_1300 or mast_1400 (or 1300/1400 mm) as the baseline or installation height, and citations of P-03 rev18.1 item 6
      human: {reviewer: platform-lead, evidence: URDF/Xacro mast configuration and the general arrangement drawing at 1350 mm}
    owner: platform-lead

  - id: MAST-POSITIONS
    title: Indexed mast mounting positions
    kind: configuration
    status: recorded
    values: [1300, 1350, 1400, 1450]
    unit: mm
    step_mm: 50
    date: 2026-09-28
    source: {document: P-03-rev18.2, item: shoulder height}
    supersedes:
      - {value: nine positions 1300 to 1700 mm (mast_1300 to mast_1700), source: P-00-rev18.1 txt 293-294}
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.xacro", "**/*.urdf", "**/*.launch.py", "**/*.html"]
    check:
      - pattern: '\b(?P<found>mast_1(?:5[05]0|6[05]0|700))\b'
        unless: 'supersed|not available|cannot'
        message: only mast_1300, mast_1350, mast_1400 and mast_1450 exist
      - pattern: '(?P<found>nine\s+(?:indexed\s+)?(?:mechanical\s+)?(?:mounting\s+)?positions)'
        unless: 'supersed'
        message: four indexed positions
      - pattern: '(?P<found>\b1300\s*(?:mm\s*)?(?:to|through|\.\.|\u2013|-)\s*1700\s*mm)'
        unless: 'supersed|height envelope|assembled'
        message: positions span 1300 to 1450 mm
    verification:
      machine: configuration IDs mast_1500 to mast_1700, "nine positions", a 1300 to 1700 mm position range
      human: {reviewer: platform-lead, evidence: mast drawing with index holes}
    owner: platform-lead

