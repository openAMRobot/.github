    check:
      - pattern: '(?P<found>top at 1554(?:\s*mm)?|mast top[^\n]{0,20}\b1554\s*mm)'
        unless: 'supersed'
        message: mast top is 1500 mm
    verification:
      machine: the superseded 1554 mm mast top
      human: {reviewer: platform-lead, evidence: mast drawing and CAD}
    owner: platform-lead

  - id: MAX-ASSEMBLED-HEIGHT
    title: 1700 mm is the maximum assembled-height envelope, not a shoulder-axis height
    kind: distinction
    status: recorded
    value: 1700
    unit: mm
    date: null
    source: {document: P-03-rev18.1, item: item 6 line 15}
    note: Repeated unchanged in P-03-rev18.2 as cited by the documentation site. The robot may be lower, never higher.
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]
    check:
      - pattern: '(?P<found>max(?:imum)?\s+(?:assembled\s+|robot\s+)?height\s*(?:of|is|:)?\s*(?!1700)1\d{3}\s*mm)'
        message: maximum assembled height is 1700 mm
      - pattern: '(?P<found>(?:shoulder[- ]axis|shoulder height|mast_)[^\n]{0,20}\b1700\b)'
        unless: 'max|envelope|not (?:the )?shoulder|higher|supersed'
        message: 1700 mm is the assembled-height envelope, not a shoulder height or mast position
    verification:
      machine: another maximum-height value, or 1700 mm presented as a shoulder height or mast position
      human: {reviewer: platform-lead, evidence: assembled-height measurement on the general arrangement}
    owner: platform-lead

  - id: BATTERY-PLACEMENT
    title: Battery pack and placement
    kind: value
    status: recorded
    value: One 8S1P EVE LF105 LiFePO4 pack, 25.6 V, 105 Ah, centred at 25 percent of the robot length from the rear
    unit: none
    date: 2026-09-28
    source: {document: P-03-rev18.2, item: battery}
    supersedes:
      - {value: fit the existing battery bay first, source: P-00-rev18.1 txt 77}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
      - pattern: 'battery[^\n]{0,40}\bcent(?:red|ered) at (?P<found>(?!25\b)\d+\s*(?:%|percent))'
        message: battery is centred at 25 percent of the length from the rear
    verification:
      machine: a different battery centre position in text
      human: {reviewer: platform-lead, evidence: general arrangement and mass model}
    owner: platform-lead
    note: The rev18.1 plan set did not record a placement; P-03 rev18.2 records it.

  - id: SPEED-CEILING
    title: 1.5 m/s is a command ceiling, not an operating speed
    kind: limit
    status: recorded
    value: 1.5 m/s command ceiling, treated as an analytical limit; the accepted operating speed follows from the stability model and stopping tests
    unit: m/s
    date: 2026-09-28
    source: {document: P-03-rev18.2, item: speed}
    supersedes:
      - {value: 1.5 m/s treated as an accepted operating speed, source: P-00-rev18.1 txt 60 and 352}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
      - pattern: '(?P<found>software speed limit\s*(?:of\s*)?1\.5\s*m/s)'
        unless: 'ceiling|analytical'
        message: 1.5 m/s is a command ceiling, not an operating limit
      - pattern: '(?P<found>(?:operating|validated|rated) speed\s*(?:of|is|:)?\s*1\.5\s*m/s)'
        unless: 'ceiling|analytical|not'
        message: 1.5 m/s is not an accepted operating speed
    verification:
      machine: 1.5 m/s presented as a software or operating speed limit in text
      human: {reviewer: platform-lead, evidence: stability model and recorded stopping tests; configured velocity limits in the Nav2 and base parameters}
    owner: platform-lead

  - id: DRIVETRAIN
    title: Drivetrain
    kind: value
    status: recorded
    value: Two ZLTECH ZLLG80ASM250-L-B hub motors with brakes, one ZLAC8015D V4.2 driver on CAN1 (CANopen), 200 mm wheels
    unit: none
    date: 2026-09-21
    source: {document: P-00-rev18.1, item: txt 16}
    applies_to:
      repositories: ["openamr-platform-*", "openamr-upperbody-*", "openamrobot-docs", "openamrobot-release", ".github"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.xacro", "**/*.urdf"]
    check:
      - pattern: '(?P<found>ZLLG80ASM250-L)(?!-B)\b'
        message: the selected motor variant is ZLLG80ASM250-L-B
      - pattern: '(?P<found>ZL ?TECH[^\n]{0,40}\b(?:alternative|option(?:al)?)\b)'
        message: ZLTECH is the selected 2.0 drivetrain, not an option
      - pattern: '(?P<found>fail-safe brakes?)'
        unless: 'pending|F2A|verif|not yet|unverified'
        message: brake fail-safe function and ratings are open supplier-evidence gates
    verification:
      machine: the unbraked motor variant, ZLTECH described as optional, brakes described as fail-safe
      human: {reviewer: platform-lead, evidence: supplier datasheets for the brake rating and fail-safe behaviour}
    owner: platform-lead

  - id: RS485-NOT-IN-2-0
    title: Release 2.0 has no RS485 hardware, fallback, adapter or commissioning path
    kind: exclusion
    status: recorded
    value: none
    unit: none
    date: null
    source: {document: P-03-rev18.1, item: item 4}
    applies_to:
      repositories: ["openamr-platform-hw", "openamr-platform-fw", "openamr-upperbody-*", "openamrobot-docs"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]
    check:
      - pattern: '(?P<found>RS-?485)'
        unless: 'not used|no RS-?485|not provisioned|without|legacy|Gate A|removed|not in 2\.0'
        message: RS485 is not provisioned in 2.0
      - pattern: '(?P<found>CAN or serial)'
        message: CAN1 and CAN2 are dedicated; no upper-body serial link to the base
    verification:
      machine: RS485 mentioned without a negation or legacy label; "CAN or serial" links
      human: {reviewer: platform-lead, evidence: wiring diagram and BOM without RS485 parts}
    owner: platform-lead

  - id: BASE-CONTROLLER-GATES
    title: Base-controller gates and IMU gating stay distinct
    kind: distinction
    status: recorded
    values:
      - Gate A, Jetson with the existing Teensy, ZBLD/PWM drivetrain and MPU6500 (legacy test configuration)
      - Gate B, Jetson with the STM32H723ZG (NUCLEO-H723ZG bench board) and the ZLTECH drivers
      - ICM-42688-P enters the manufacturing BOM only after side-by-side robot evidence; adoption decision 20 November 2026
      - STM32 go/no-go 6 November 2026; fallback is the validated legacy Teensy/PWM build behind I8
    unit: none
    date: null
    source: {document: P-00-rev18.1, item: "txt 63, 101, 106, 344; I8-WP adoption gate; Gate B board per P-03-rev18.5 item 14"}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
      - pattern: '(?P<found>Teensy[^\n]{0,20}\bbench target)'
        message: Teensy is the Gate A controller and the release fallback, not a bench target
      - pattern: '(?P<found>ICM-42688-P[^\n]{0,40}\b(?:selected|baseline|chosen)\b)'
        unless: 'Gate B|conditional|20 Nov|candidate|pending|not yet|after'
        message: ICM-42688-P is gated; MPU6500 remains the Gate A IMU
      - pattern: '\b(?P<found>MPU6050)\b'
        message: the Gate A IMU is the MPU6500
    verification:
      machine: Teensy called a bench target, ICM-42688-P called selected without its gate, MPU6050 named as the IMU
      human: {reviewer: platform-lead, evidence: gate records (Gate A test log, STM32 go/no-go record, IMU side-by-side data)}
    owner: platform-lead

  - id: BASE-CONTROLLER-IO
    title: Base-controller MCU, sensor and IMU buses, CAN mapping and micro-ROS transport
    kind: configuration
    status: recorded
    values:
      - Base controller STM32H723ZG on NUCLEO-H723ZG
      - TF-Luna on UART, one per UART
      - MB7040 one per I2C bus
      - IMU on a dedicated SPI, Mode 0
      - CAN1 traction only, CAN2 BMS, CAN3 upper-body actuators
      - micro-ROS over Ethernet
    unit: none
    date: 2026-10-06
    source: {document: P-03-rev18.5, item: item 14}
    supersedes:
      - {value: STM32H743 on NUCLEO-H743ZI2, source: P-00-rev18.1 (Gate B bench board)}
    applies_to: {repositories: ["*"], files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.html"]}
    check:
      - pattern: '(?P<found>NUCLEO-H743ZI2|STM32H743)'
        unless: 'supersed|legacy|historical|replaced'
        message: the base controller is the STM32H723ZG on the NUCLEO-H723ZG; label STM32H743 / NUCLEO-H743ZI2 material as superseded
    verification:
      machine: NUCLEO-H743ZI2 or STM32H743 without a superseded, legacy, historical or replaced label
      human: {reviewer: platform-lead, evidence: P-03 rev18.5 item 14 and the MCU I/O allocation in openamr-platform-hw}
    owner: platform-lead

  - id: IMU-TOPIC-OWNERSHIP
    title: IMU topic ownership
    kind: distinction
    status: recorded
    values:
      - firmware publishes /imu/data_raw
      - the host filter and EKF own /imu/data
    unit: none
    date: null
    source: {document: P-00-rev18.1, item: txt 15 and 345; I8-WP line 224}
    applies_to:
      repositories: ["openamr-platform-*", "openamrobot-docs", "openamrobot-ui"]
      files: ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.launch.py", "**/*.launch.xml", "**/*.ino", "**/*.cpp", "**/*.h"]
    check:
      - pattern: '(?:micro-?ROS agent|Teensy|firmware|MCU|STM32)[^\n]{0,80}(?P<found>/imu/data)(?!_raw)\b'
        unless: '\bhost\b|(?<!un)filter|EKF|madgwick|must not|never'
        message: firmware publishes /imu/data_raw; /imu/data belongs to the host filter
      - pattern: '"(?P<found>/?imu/data)"'
        files: ["**/*.ino", "**/*.cpp", "**/*.c", "**/*.h"]
        message: firmware must not publish filtered /imu/data
    verification:
      machine: text attributing /imu/data to firmware; firmware sources containing the literal topic imu/data
      human: {reviewer: software-lead, evidence: ros2 topic info on the running bring-up showing one publisher per topic}
    owner: software-lead

