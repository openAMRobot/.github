# OpenAMRobot register of approved technical decisions.
#
# Two layers, kept separate:
#   - AGENTS.md and CONTRIBUTING.md hold process: how a decision is proposed,
#     reviewed, recorded, changed, tested and propagated.
#   - This file holds the approved technical decisions repositories follow:
#     values with units, allowed configurations, limits, exclusions and
#     semantic distinctions.
#
# CI evaluates only this pinned, version-controlled file. No check fetches a
# plan document, a drive or the documentation site. Source documents are
# provenance: when a source and this register disagree, a human resolves it
# (the entry's owner) and no tool rewrites either side. tools/check_decisions.py
# only reads files and reports.
#
# What the scan proves: that a scanned file does not contain a listed
# contradicting phrase. It proves textual consistency only, never mechanical,
# electrical or safety correctness. Each entry's `verification.human` names
# the reviewer and the evidence that the scan cannot provide.
#
# Schema (schema_version 1), one entry per decision:
#   id            unique, upper case, stable
#   title         one line
#   summary       optional; the decision in one line of at most 120 characters,
#                 printed with each finding (the long value stays here)
#   fix_hint      optional; how to fix a finding, one line of at most 120 characters
#   kind          value | configuration | limit | exclusion | distinction
#   status        recorded (scanned and reported) | open (not decided; not scanned) |
#                 superseded (replaced by a later decision; only its citation is scanned)
#   value/values  exactly as the source states it; nothing invented
#   unit          SI unit or none
#   date          date the decision was taken (null when the source gives none)
#   review_by     review date; six weeks after date, or six weeks after this register update when date is null
#   source        document (a key under sources) and item
#   supersedes    earlier values with their source; optional `citation`, a
#                 pattern that finds text still citing the superseded source
#   applies_to    repositories (globs) and files (globs); exclude optional
#   check         patterns; each has a (?P<found>...) group, optional files
#                 (globs narrowing this pattern), optional line-level `unless`
#                 exemption and a message
#   verification  machine: what the scan detects; human: reviewer role and
#                 the evidence they need
#   owner         role in maintainers.yaml who approves changes to this entry
#   superseded_by for status superseded: document (a key under sources), item,
#                 optional decision (the replacing entry), citation (a pattern
#                 with a (?P<found>...) group for text still presenting the
#                 superseded value as current) and optional unless; `check`
#                 is then not used
#
# Changing an entry follows "Changing a decision" in AGENTS.md: change request
# issue, source document first, then one reviewed PR that updates this file and
# every affected consumer together.
schema_version: 1

