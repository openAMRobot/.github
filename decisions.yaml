      - head camera ZED-121210 (exact commercial identity pending, see HEAD-CAMERA-IDENTITY)
      - two in-hand RGB wrist cameras; no separate torso scene camera
    unit: none
    date: 2026-09-23
    source: {document: P-00-rev18.1, item: txt 85 and 97}
    applies_to:
      repositories: ["openamr-*", "openamrobot-docs", "openamrobot-manipulation", "openamrobot-ui"]
    check:
      - pattern: '(?P<found>\b(?:D4[35]5i?|RealSense)\b)'
        unless: 'legacy|historical|previous|not used|replaced'
        message: the base camera is the Orbbec Gemini 336L
      - pattern: '(?P<found>down-tilted depth camera)'
        message: the base camera tilts about 10 degrees up
      - pattern: '(?P<found>IMX708|Pi Camera Module 3)'
        unless: 'legacy|Gate A|historical'
        message: the 2.0 base camera is the Orbbec Gemini 336L
    owner: platform-lead

