name: Build CI Image

on:
  pull_request:
    paths:
      - "containers/ci/**"
      - ".github/workflows/ci-image.yml"

  push:
    branches:
      - main
    paths:
      - "containers/ci/**"
      - ".github/workflows/ci-image.yml"

  workflow_dispatch:
    inputs:
      publish_candidate:
        description: "Publish CI image candidate from main to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openamrobot/ci-ros2-jazzy

jobs:
  # Untrusted PR code can build, but has read-only repository permissions
  # and never receives registry credentials or packages: write.
  build:
    name: Validate CI image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate Docker image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: containers/ci/Dockerfile
          platforms: linux/amd64
          push: false

  # Only trusted main-branch code may publish to GHCR.
  publish:
    name: Publish CI image
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.publish_candidate == true)
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: containers/ci/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'push' && 'latest' || format('candidate-{0}', github.sha) }}

      - name: Record published image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Digest: $IMAGE_DIGEST"
          echo "Pinned reference: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$IMAGE_DIGEST"
          {
            echo "### ROS 2 CI image publication"
            echo "Run ID: ${{ github.run_id }}"
            echo "Source SHA: ${{ github.sha }}"
            echo "Digest: $IMAGE_DIGEST"
            echo "Pinned: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
