name: Watchdog organization scan

# Deterministic organization scan. Product repositories are cloned read-only. The only write
# is a central, deduplicated issue control surface in openAMRobot/.github. The workflow never
# edits decisions.yaml, pushes a branch, opens a PR, or runs an AI agent. See WATCHDOG.md.
#
# Schedule: every Thursday at 14:00 Berlin time (timezone Europe/Berlin, so the run follows
# daylight saving time), plus manual dispatch.
#
# Issue mode: the repository variable WATCHDOG_ISSUE_MODE (Settings > Secrets and variables >
# Actions > Variables) selects what the sync step writes.
#   unset or "dashboard"  only the single "[watchdog] Organization dashboard" issue, updated in
#                         place; it lists every active group and every scan-blocked repository.
#   "groups"              also one deduplicated issue per active group (finding, decision review,
#                         blocked scan), as described in WATCHDOG.md.
# The platform lead decides when to switch to "groups" (WATCHDOG.md, "Watchdog issue mode").

on:
  schedule:
    - cron: "0 14 * * 4"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog-org-scan
  cancel-in-progress: false

jobs:
  scan:
    name: watchdog-org-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Scan repositories
        shell: bash
        env:
          WATCHDOG_ANNOTATIONS: "0"
          HARNESS: harness
          WORK: ${{ runner.temp }}/watchdog
        run: |
          set -uo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user 'PyYAML==6.0.2'
          mkdir -p "$WORK/repos" "$WORK/out"
          echo '[]' > "$WORK/blocked.json"
          python3 - "$HARNESS/rollout/repositories.yaml" > "$WORK/list.txt" <<'PY'
          import sys, yaml
          data = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          for r in data["repositories"]:
              print(data["organization"], r["name"], r["default_branch"])
          PY
          summary="${GITHUB_STEP_SUMMARY:-$WORK/summary.md}"
          {
            echo "## OpenAMRobot Watchdog organization scan"
            echo
            echo "Thursday run, deterministic and reportable. Findings are synchronized to deduplicated issues in the harness repository."
            echo "A clean result shows textual consistency only, not mechanical, electrical, safety or release correctness."
            echo
            echo "| Repository | Commit | Findings |"
            echo "|---|---|---:|"
          } >> "$summary"
          blocked=0
          : > "$WORK/details.md"
          while read -r org name branch; do
            dest="$WORK/repos/$name"
            if ! git clone --quiet --depth 1 --branch "$branch" "https://github.com/$org/$name.git" "$dest"; then
              echo "| $name | BLOCKED: clone failed | not scanned |" >> "$summary"
              python3 - "$WORK/blocked.json" "$name" "clone failed" <<'PY'
          import json, sys
          path, repo, reason = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data.append({"repository": repo, "reason": reason})
          json.dump(data, open(path, "w", encoding="utf-8"))
          PY
              blocked=$((blocked + 1))
              continue
            fi
            sha=$(git -C "$dest" rev-parse HEAD)
            python3 "$HARNESS/tools/watchdog.py" --root "$dest" --repository "$name" --report-only \
              --json "$WORK/out/$name.json" --markdown "$WORK/details.md" > "$WORK/out/$name.txt"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "| $name | $sha | BLOCKED: watchdog exit $status |" >> "$summary"
              python3 - "$WORK/blocked.json" "$name" "watchdog exit $status at $sha" <<'PY'
          import json, sys
          path, repo, reason = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data.append({"repository": repo, "reason": reason})
          json.dump(data, open(path, "w", encoding="utf-8"))
          PY
              blocked=$((blocked + 1))
              continue
            fi
            python3 - "$WORK/out/$name.json" "$name" "$sha" <<'PY'
          import json, sys
          path, repo, sha = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data["repository"] = repo
          data["commit"] = sha
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
            total=$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(sum(len(v or []) for v in r["results"].values()))' "$WORK/out/$name.json")
            echo "| $name | $sha | $total |" >> "$summary"
            tail -n 12 "$WORK/out/$name.txt"
          done < "$WORK/list.txt"
          {
            echo
            echo "## Findings per decision or rule, per repository"
            echo
            cat "$WORK/details.md"
          } >> "$summary"
          if [ "$blocked" -ne 0 ]; then
            echo "::error::$blocked repository scan(s) BLOCKED; the summary lists them"
            exit 1
          fi

      - name: Synchronize Watchdog issues
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the variable is unset; the tool then uses dashboard mode.
          WATCHDOG_ISSUE_MODE: ${{ vars.WATCHDOG_ISSUE_MODE }}
          HARNESS: harness
          WORK: ${{ runner.temp }}/watchdog
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 "$HARNESS/tools/watchdog_issue_sync.py" \
            --reports "$WORK/out" \
            --blocked "$WORK/blocked.json" \
            --maintainers "$HARNESS/maintainers.yaml" \
            --decisions "$HARNESS/decisions.yaml" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL" \
            --run-date "$(date -u +%F)" \
            --apply | tee -a "${GITHUB_STEP_SUMMARY:-$WORK/summary.md}"

      - name: Upload scan logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchdog-org-scan
          path: ${{ runner.temp }}/watchdog/
          if-no-files-found: warn
