name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    name: repository-quality
    uses: ./.github/workflows/repository-quality-reusable.yml
    with:
      # This repository is the harness: check each change against its own head.
      harness_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      harness_checks: true

  harness-tests:
    name: quality/test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Unit tests of every checker (zero-test guard)
        shell: bash
        run: |
          # verify.sh runs tests without user site-packages; use the system package.
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          # The lint stage runs shellcheck when present; install it so the result does not depend on the image.
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          VERIFY_PATH="$PATH" bash rollout/verify.sh
      - name: Validate decisions.yaml
        run: python3 tools/check_decisions.py --decisions decisions.yaml --maintainers maintainers.yaml --validate-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-verification
          path: .verification/run.*/
          include-hidden-files: true
          if-no-files-found: warn

  ros-verifier-smoke:
    name: ros-verifier-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out pinned interfaces fixture
        env:
          INTERFACES_SHA: fa7c438e33bd807c174fa0747119d7d627faa3bf
        run: |
          set -euo pipefail
          interfaces="$RUNNER_TEMP/openamrobot-interfaces"
          git clone --quiet https://github.com/openAMRobot/openamrobot-interfaces.git "$interfaces"
          git -C "$interfaces" checkout --quiet --detach "$INTERFACES_SHA"
          # Exercise the source-only scan with normal generated workspace directories present.
          mkdir -p "$interfaces/ros2/build" "$interfaces/ros2/install" "$interfaces/ros2/log"
          test -d "$interfaces/ros2/build"
          test -d "$interfaces/ros2/install"
          test -d "$interfaces/ros2/log"

      - name: Run generic verifier in ROS 2 Jazzy
        run: |
          set -euo pipefail
          interfaces="$RUNNER_TEMP/openamrobot-interfaces"
          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/work/harness:ro" \
            -v "$interfaces:/work/interfaces" \
            -w /work \
            ros:jazzy-ros-base bash -ceu '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y git python3-pip python3-jsonschema ros-jazzy-rmw-cyclonedds-cpp shellcheck
              rosdep update
              python3 -c "import jsonschema" 2>/dev/null || python3 -m pip install --break-system-packages --quiet jsonschema
              git config --global --add safe.directory /work/interfaces
              test -d /work/interfaces/ros2/build
              test -d /work/interfaces/ros2/install
              test -d /work/interfaces/ros2/log
              VERIFY_NO_DELEGATE=1 VERIFY_TEST="bash tools/verify.sh" bash /work/harness/rollout/verify.sh /work/interfaces
            '
