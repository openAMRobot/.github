# Allowlist for tools/check_public_extract.py.
# Each entry: rule, match (regular expression for the whole matched text),
# optional paths and repositories (globs), and a reason. Adding an entry is a
# review decision: the docs owner decides, the platform lead decides entries
# about commercial or company information.
allow:
  - rule: email
    match: 'info@botshare\.ai'
    reason: published organization contact for licensing and maintainers (DOCUMENTATION_STANDARD.md)
  - rule: email
    match: '[^@\s]+@(?:example\.(?:com|org|net)|users\.noreply\.github\.com)'
    reason: documentation placeholders and GitHub no-reply identities
  - rule: email
    match: '[^@\s]+@[^@\s]+'
    paths: ["web/public/ros/*.js"]
    repositories: ["openamrobot-ui"]
    reason: third-party author attribution inside vendored roslib/ros2d bundles; provenance must be preserved
  - rule: email
    match: 'paroga@paroga\.com'
    paths: ["README.md"]
    repositories: ["openamrobot-ui"]
    reason: copyright notice of the bundled cbor-js library; provenance must be preserved
  - rule: credential
    match: '.*(?:your|example|placeholder|changeme|xxxx|<[^>]*>).*'
    reason: placeholder values in setup instructions, not secrets
