# Allowlist for tools/check_public_extract.py. Kept narrow on purpose: it admits
# published contact and licensing information, not e-mail addresses in general.
#
# Policy: the canonical documentation policy is openamrobot-docs/docs/DOCUMENTATION_STANDARD.md
# (https://github.com/openAMRobot/openamrobot-docs/blob/main/docs/DOCUMENTATION_STANDARD.md).
# This allowlist is an implementation detail of the public-extract check, not policy. It
# separates intentional public content (organization contact, licensing information,
# documentation) from accidental leakage (internal document links, private contact data,
# prices, credentials). If this file and the standard disagree, the standard wins and this
# file is corrected; a new kind of allowed content starts as a change to the standard.
#
# Entry fields: rule, match (regular expression for the whole matched text),
# optional paths and repositories (globs), optional line (regular expression
# the whole source line must contain), and reason. GitHub handles such as
# @BotshareAI are not e-mail addresses and need no entry.
#
# Adding an entry is a review decision: the docs owner decides entries about
# published pages, the platform lead decides entries about company or
# commercial information. Each entry below states why it is legitimate.
allow:
  - rule: email
    match: 'info@botshare\.ai'
    reason: >-
      Published organization contact for licensing and maintainers, named in
      DOCUMENTATION_STANDARD.md and CONTRIBUTING.md.
  - rule: email
    match: '[^@\s]+@(?:example\.(?:com|org|net)|users\.noreply\.github\.com)'
    reason: Documentation placeholders and GitHub no-reply identities, which identify no person.
  - rule: email
    match: '[^@\s]+@[^@\s]+'
    line: '@author\b|\b(?:copyright|licen[cs]e[ds]?|spdx-license-identifier|authors?:|maintainers?:)|\(c\)'
    reason: >-
      Licence and copyright notices of third-party code must keep their author
      contact to preserve provenance (THIRD_PARTY_POLICY.md). Only lines that
      are such notices qualify.
  - rule: price
    match: '(?:from\s+)?€\d[\d,.]*(?:/mo)?'
    paths: ["README.md"]
    repositories: [".github"]
    reason: >-
      Public pricing: the sponsorship tiers on the organization governance README.
      Approved as published pricing by the platform lead on 29 September 2026.
  - rule: price
    match: '€\d[\d,.]*(?:/mo)?'
    paths: ["profile/README.md"]
    repositories: [".github"]
    reason: >-
      Public pricing: the robot offerings and sponsorship tiers on the organization
      profile. Approved as published pricing by the platform lead on 29 September 2026.
  - rule: credential
    match: '.*(?:your|example|placeholder|changeme|xxxx|<[^>]*>).*'
    reason: Placeholder values in setup instructions, not secrets.
