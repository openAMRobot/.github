# Fixture register for tests/test_check_decisions.py. Synthetic values only;
# not decisions of record.
schema_version: 1
in_force: {source: FIX-DOC, date: 2026-10-07}
sources:
  FIX-DOC: {title: Fixture decision document revision 2, evidence: tests only}
exclude: ["**/CHANGELOG.md"]
decisions:
  - id: FIX-MAST
    title: Fixture installation height
    kind: configuration
    status: recorded
    value: 1350
    unit: mm
    date: 2026-09-28
    review_by: 2026-11-18
    source: {document: FIX-DOC, item: item 1}
    supersedes:
      - value: 1400
        source: FIX-DOC revision 1 item 1
        citation: '(?P<found>FIX-DOC\s+rev(?:ision)?\s*1\b[^\n]{0,20}item\s*1)'
    applies_to:
      repositories: ["*"]
      files: ["**/*.md", "**/*.yaml", "**/*.launch.py", "**/*.xacro", "**/package.xml"]
    check:
      - pattern: '(?P<found>mast_1400)\b[^\n]{0,40}baseline'
        unless: 'legacy'
        message: baseline is mast_1350
    verification:
      machine: mast_1400 named as baseline; citations of the superseded revision
      human: {reviewer: platform-lead, evidence: fixture drawing}
    owner: platform-lead
  - id: FIX-IMU
    title: Fixture topic ownership
    kind: distinction
    status: recorded
    values: [firmware publishes /imu/data_raw, host filter owns /imu/data]
    unit: none
    date: null
    review_by: 2026-11-18
    source: {document: FIX-DOC, item: item 2}
    applies_to: {repositories: ["platform-*"], files: ["**/*.launch.py", "**/*.xacro"]}
    check:
      - pattern: '"(?P<found>/?imu/data)"'
        files: ["**/*.launch.py", "**/*.xacro"]
        message: firmware must not publish /imu/data
    verification:
      machine: literal /imu/data in launch or xacro files
      human: {reviewer: software-lead, evidence: topic list from a running system}
    owner: software-lead
  - id: FIX-OPEN
    title: Fixture open decision, never scanned
    kind: value
    status: open
    value: undecided
    unit: none
    date: null
    review_by: 2026-11-18
    source: {document: FIX-DOC, item: item 3}
    applies_to: {repositories: ["*"], files: ["**/*.md"]}
    check:
      - pattern: '(?P<found>undecided-value)'
    verification:
      machine: none while open
      human: {reviewer: platform-lead, evidence: a recorded decision}
    owner: platform-lead
